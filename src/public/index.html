<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PDF Compressor Engine</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body>
    <div class="w-full h-screen flex flex-col items-center justify-center">
      <form
        id="pdf-compress-form"
        accept-charset="utf-8"
        class="w-5/6 md:w-3/6 lg:w-2/6 p-6 border border-gray-300 rounded-sm"
      >
        <label
          for="pdf-file-input"
          class="w-full flex flex-col items-center justify-center h-60 border-2 border-dashed border-gray-300 relative cursor-pointer"
        >
          <i
            class="fa-regular fa-file-pdf absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 -z-10 text-gray-200 text-8xl"
          ></i>
          <span id="file-name-display" class="font-semibold">Please select a PDF file</span>
          <span id="file-size-display" class="font-semibold mt-2 hidden"></span>
          <input
            type="file"
            name="pdfFile"
            id="pdf-file-input"
            accept="application/pdf"
            class="hidden"
          />
        </label>

        <div class="mt-6">
          <label for="compression-depth-input" class="block text-sm font-medium text-gray-700">
            Compression depth
          </label>
          <input
            type="range"
            name="compressionDepth"
            id="compression-depth-input"
            min="1"
            max="4"
            value="1"
            class="w-full accent-blue-400 mt-2"
            disabled
          />
          <div class="w-full flex items-center justify-between text-sm mt-1">
            <span class="text-green-600">Low</span>
            <span class="text-blue-600">Medium</span>
            <span class="text-yellow-600">High</span>
            <span class="text-red-600">Extreme</span>
          </div>
        </div>

        <button
          type="submit"
          id="compress-submit-btn"
          class="w-full h-10 bg-blue-400 mt-6 rounded-sm cursor-pointer text-white disabled:bg-blue-200 disabled:cursor-not-allowed flex items-center justify-center gap-2"
          disabled
        >
          <span id="button-text">Compress PDF</span>
        </button>

        <button
          type="button"
          id="reset-btn"
          class="hidden mt-2 w-full h-10 bg-red-400 rounded-sm cursor-pointer text-white disabled:bg-blue-200 disabled:cursor-not-allowed flex items-center justify-center gap-2"
        >
          <span id="button-text">Compress another PDF</span>
        </button>
      </form>

      <p class="mt-20">Made with ❤️ by Sandeep</p>
    </div>

    <script>
      const compressForm = document.getElementById('pdf-compress-form');
      const pdfFileInput = document.getElementById('pdf-file-input');
      const compressionDepthInput = document.getElementById('compression-depth-input');
      const compressSubmitBtn = document.getElementById('compress-submit-btn');
      const resetBtn = document.getElementById('reset-btn');
      const buttonText = document.getElementById('button-text');
      const fileNameDisplay = document.getElementById('file-name-display');
      const fileSizeDisplay = document.getElementById('file-size-display');

      pdfFileInput.addEventListener('change', (event) => {
        const selectedFile = event.target.files[0];

        if (selectedFile) {
          const fileSizeInMB = (selectedFile.size / (1024 * 1024)).toFixed(2);
          fileNameDisplay.innerText = selectedFile.name;
          fileSizeDisplay.innerText = `${fileSizeInMB} MB`;
          fileSizeDisplay.classList.remove('hidden');

          compressionDepthInput.disabled = false;
          compressSubmitBtn.disabled = false;
        } else {
          fileNameDisplay.innerText = 'Please select a PDF file';
          fileSizeDisplay.innerText = '';
          fileSizeDisplay.classList.add('hidden');

          compressionDepthInput.disabled = true;
          compressSubmitBtn.disabled = true;
        }
      });

      compressForm.addEventListener('submit', async (event) => {
        event.preventDefault();

        const selectedFile = pdfFileInput.files[0];
        if (!selectedFile) return;

        // Activate loading state
        compressSubmitBtn.disabled = true;
        compressionDepthInput.disabled = true;
        buttonText.innerText = 'Compressing...';

        // Append FontAwesome spinning icon
        const spinnerIcon = document.createElement('i');
        spinnerIcon.className = 'fa-solid fa-spinner fa-spin';
        compressSubmitBtn.prepend(spinnerIcon);

        const formData = new FormData();
        formData.append('file', selectedFile);
        formData.append('depth', compressionDepthInput.value);

        try {
          const response = await fetch('http://localhost:4000/api/compress', {
            method: 'POST',
            body: formData,
          });

          if (!response.ok) throw new Error('Upload failed');

          if (response.status === 201) {
            resetBtn.classList.replace('hidden', 'block');
          }

          const result = await response.json();
          console.log(result);
        } catch (error) {
          console.error('Compression Error:', error);
          alert('Something went wrong! Please try again.');
        } finally {
          // Reset loading state
          spinnerIcon.remove();
          buttonText.innerText = 'Compress PDF';
          compressSubmitBtn.disabled = false;
          compressionDepthInput.disabled = false;
        }
      });

      resetBtn.addEventListener('click', (e) => {
        e.preventDefault();
        window.navigation.reload();
      });
    </script>
  </body>
</html>
